
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Graphics Designer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="overlay"></div>

    <header class="main-header">
        <nav class="main-nav container">
            <div class="logo">MD Touhinul Kabir</div>
            <ul class="nav-links">
                <li><img src="images/navigation.jpg" alt="Navigation Image" class="nav-image"></li>
                <li class="nav-name">MD Touhinul Kabir</li>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li class="close-btn"><span>&times;</span></li>
            </ul>
            <div class="dark-mode-toggle">
                <span>☼</span> <!-- Sun icon -->
            </div>
            <div class="hamburger">
                <span>☰</span> <!-- Hamburger icon -->
            </div>
        </nav>
    </header>

    <main>
        <section class="contact-section container fade-in">
            <h2>Get In Touch</h2>
            <form class="contact-form" action="mailto:mdtouhinulkabir695@gmail.com" method="post" enctype="text/plain">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
            <div class="contact-info">
                <div class="map-container">
                    <!-- Google Map Embed Code will go here -->
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14602.83407611966!2d90.25478305!3d23.79796955!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755b8b087029b41%3A0x50792f92ae1c4e0!2sSavar%2C%20Bangladesh!5e0!3m2!1sen!2sus!4v1678888888888!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <div class="social-icons-contact">
                    <a href="mailto:mdtouhinulkabir695@gmail.com">
                        <img src="images/gmail.jpg" alt="Gmail Icon" class="gmail-icon">
                    </a>
                    <a href="https://www.facebook.com/mdathin" target="_blank">
                        <img src="images/facebook.jpg" alt="Facebook Icon" class="facebook-icon">
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 MD Touhinul Kabir. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
